<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      padding: 18px 16px 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1A1A2E;
      color: #EAEAEA;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .logo { font-size: 20px; }
    h2 { font-size: 15px; font-weight: 600; color: #4ECCA3; }
    #profile {
      font-size: 13px;
      color: #A0A0A0;
      margin-bottom: 14px;
      min-height: 18px;
    }
    #profile span { color: #EAEAEA; font-weight: 500; }
    #stopBtn {
      width: 100%;
      padding: 10px;
      background: #E94560;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.15s;
    }
    #stopBtn:hover:not(:disabled) { background: #FF5770; }
    #stopBtn:disabled { background: #3A3A50; color: #666; cursor: default; }
    .msg {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      min-height: 16px;
    }
    .msg.ok  { color: #4ECCA3; }
    .msg.err { color: #E94560; }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">📊</span>
    <h2>InstAnalytics</h2>
  </div>
  <div id="profile">Caricamento...</div>
  <button id="stopBtn" disabled>Stop Tracking</button>
  <div id="msg" class="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
